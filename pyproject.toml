[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "vector-companion"
version = "0.1.0"
description = "AI brain, MCP server and CLI for an Anki/DDL Vector running wire-pod"
requires-python = ">=3.9"
dependencies = ["mcp>=1.2,<2", "pillow"]

[project.optional-dependencies]
sdk = ["wirepod_vector_sdk"]
app = ["pywebview>=5"]
ears = ["openwakeword>=0.6", "sounddevice", "faster-whisper", "onnxruntime", "scipy"]

[project.scripts]
vector = "vector_companion.cli:main"
vector-brain = "vector_companion.brain:main"
vector-mcp = "vector_companion.mcp_server:main"
vector-app = "vector_companion.app.__main__:main"

[tool.setuptools]
packages = ["vector_companion", "vector_companion.app", "vector_companion.app.static"]

[tool.setuptools.package-data]
"vector_companion.app.static" = ["*"]
